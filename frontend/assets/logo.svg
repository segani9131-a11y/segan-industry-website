<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Metallic SI Logo for Segan Industry -->
  <defs>
    <!-- Silver metallic gradient -->
    <linearGradient id="silverGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8E8E8;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#C0C0C0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#A8A8A8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D4D4D4;stop-opacity:1" />
    </linearGradient>
    
    <!-- Electric blue accent gradient -->
    <linearGradient id="electricBlueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0099CC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#006699;stop-opacity:1" />
    </linearGradient>
    
    <!-- Yellow spark gradient -->
    <linearGradient id="yellowSparkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:1" />
    </linearGradient>
    
    <!-- Metallic shine effect -->
    <linearGradient id="shineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0);stop-opacity:1" />
      <stop offset="50%" style="stop-color:rgba(255,255,255,0.8);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(255,255,255,0);stop-opacity:1" />
    </linearGradient>
    
    <!-- Drop shadow filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode in="offsetblur"/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
    
    <!-- Inner glow filter -->
    <filter id="innerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background circle with metallic finish -->
  <circle cx="100" cy="100" r="95" fill="url(#silverGradient)" filter="url(#dropShadow)"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#silverGradient)" stroke-width="2"/>
  
  <!-- Inner highlight ring -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="url(#shineGradient)" stroke-width="1" opacity="0.6"/>
  
  <!-- S Letter - Metallic -->
  <path d="M65 55 
           C55 55, 50 60, 50 70
           C50 78, 55 83, 65 83
           C72 83, 78 78, 78 70
           C78 65, 75 60, 68 58
           L68 58
           C75 52, 85 52, 90 60
           C95 68, 95 80, 88 88
           C80 96, 65 96, 55 88
           C45 80, 45 68, 55 60
           C62 55, 70 52, 78 55" 
        fill="none" 
        stroke="url(#silverGradient)" 
        stroke-width="12" 
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#dropShadow)"/>
  
  <!-- S Letter - Electric Blue Accent -->
  <path d="M65 55 
           C55 55, 50 60, 50 70
           C50 78, 55 83, 65 83
           C72 83, 78 78, 78 70
           C78 65, 75 60, 68 58
           L68 58
           C75 52, 85 52, 90 60
           C95 68, 95 80, 88 88
           C80 96, 65 96, 55 88
           C45 80, 45 68, 55 60
           C62 55, 70 52, 78 55" 
        fill="none" 
        stroke="url(#electricBlueGradient)" 
        stroke-width="4" 
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="0.8"/>
  
  <!-- I Letter - Metallic -->
  <rect x="115" y="45" width="10" height="100" rx="5" fill="url(#silverGradient)" filter="url(#dropShadow)"/>
  
  <!-- I Letter - Electric Blue Accent -->
  <rect x="117" y="48" width="6" height="94" rx="3" fill="url(#electricBlueGradient)" opacity="0.8"/>
  
  <!-- Connecting wire/circuit element between S and I -->
  <path d="M95 70 Q105 65, 115 70" 
        fill="none" 
        stroke="url(#electricBlueGradient)" 
        stroke-width="3" 
        stroke-linecap="round"
        stroke-dasharray="8,4"
        opacity="0.6"/>
  
  <!-- Yellow spark accent dots -->
  <circle cx="55" cy="50" r="4" fill="url(#yellowSparkGradient)" filter="url(#dropShadow)"/>
  <circle cx="135" cy="130" r="3" fill="url(#yellowSparkGradient)" filter="url(#dropShadow)"/>
  <circle cx="145" cy="55" r="2" fill="url(#yellowSparkGradient)" filter="url(#dropShadow)"/>
  <circle cx="45" cy="140" r="2.5" fill="url(#yellowSparkGradient)" filter="url(#dropShadow)"/>
  
  <!-- Circuit board pattern elements -->
  <g opacity="0.15" stroke="url(#electricBlueGradient)" stroke-width="1">
    <rect x="30" y="30" width="20" height="2" rx="1"/>
    <rect x="30" y="30" width="2" height="20" rx="1"/>
    <rect x="150" y="150" width="20" height="2" rx="1"/>
    <rect x="168" y="150" width="2" height="20" rx="1"/>
    <line x1="35" y1="165" x2="55" y2="165"/>
    <line x1="35" y1="165" x2="35" y2="145"/>
  </g>
  
  <!-- Company name text -->
  <text x="100" y="175" text-anchor="middle" font-family="Montserrat, sans-serif" font-size="11" font-weight="600" fill="#888888" letter-spacing="2px">SEGAN INDUSTRY</text>
  <text x="100" y="188" text-anchor="middle" font-family="Montserrat, sans-serif" font-size="8" fill="#AAAAAA" letter-spacing="1px">PRIVATE LIMITED</text>
</svg>